{% extends "layout.html" %}
{% block body %}
<!--Home page -->
<!-- 3 column grid-->
<div class="three-column">
    {% for bike in results %}
    <a href="{{ url_for('bike',id=bike[0]) }}">
        <div class="w3-card-4">
            <!-- the name the image -->
            <h1>{{ bike[2] }}</h1>
            <img src="{{ bike[3] }}" alt="{{ bike[2] }}">
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
